<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos do Cão</title>
</head>
<body>
  <main id="app">
    <div class="camada-nuvem" aria-hidden="true">
      <img src="icons/nuvem.png" alt="" draggable="false">
    </div>


    <header class="cabecalho">
      <div class="marca">
        <div class="marca-sol" aria-hidden="true"></div>
        <div class="marca-texto">
          <h1 data-marca></h1>
          <p data-submarca></p>
        </div>
      </div>
    </header>

    <section class="area-menu" aria-labelledby="titulo-menu">
      <div class="decoracao decoracao-esquerda" aria-hidden="true"></div>
      <div class="decoracao decoracao-direita" aria-hidden="true"></div>

      <div class="titulo-menu">
        <h2 id="titulo-menu" data-titulo-menu></h2>
      </div>

      <div class="anos" id="anos">
        <template id="modelo-ano">
          <article class="ano">
            <button class="botao-ano" type="button">
              <div class="icone-ano"></div>
              <div class="texto-ano">
                <div class="nome-ano"></div>
                <div class="idade-ano"></div>
              </div>
            </button>
          </article>
        </template>
      </div>
    </section>

    <section class="destaques" aria-labelledby="titulo-destaques">
      <div class="titulo-destaques">
        <span class="linha"></span>
        <h2 id="titulo-destaques"><span aria-hidden="true">🎮</span> Jogos em destaque</h2>
        <span class="linha"></span>
      </div>

      <div class="jogos" id="jogos">
        <template id="modelo-jogo">
          <article class="jogo">
            <div class="icone-jogo">
              <img alt="" draggable="false">
            </div>
            <div class="nome-jogo"></div>
            <div class="estrelas" aria-label="5 estrelas">★★★★★</div>
          </article>
        </template>
      </div>
    </section>

    <footer class="rodape">
      <div class="rodape-item">
        <span class="estrela" aria-hidden="true">★</span>
        <span data-mensagem></span>
      </div>
      <div class="rodape-item rodape-info">
        <span class="info" aria-hidden="true">i</span>
        <span data-informacao></span>
      </div>
    </footer>

  </main>
  <script src="dados.js"></script>
</body>
</html>
