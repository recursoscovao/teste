<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-browser-titulo>Divisão Silábica - Recursos Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <button class="botao-menu" aria-label="Menu Principal" aria-expanded="false" aria-controls="menu-acordeao"></button>
    
    <div class="marca">
      <div class="marca-sol" aria-hidden="true"></div>
      <div class="marca-texto">
        <h1 data-marca></h1>
        <p data-submarca></p>
      </div>
    </div>

    <button class="botao-seta" aria-label="Voltar"></button>

    <!-- MENU ACORDEÃO -->
    <nav id="menu-acordeao" class="menu-acordeao" aria-hidden="true">
      <div class="menu-acordeao-topo">
        <div class="menu-acordeao-titulo" data-titulo-menu-acordeao></div>
        <div class="menu-acordeao-subtitulo" data-informacao></div>
      </div>
      <div id="menu-anos" class="menu-anos"></div>
    </nav>
  </header>

  <div id="app">
    <!-- ÁREA PRINCIPAL DO JOGO -->
    <main class="area-menu">
      <div class="titulo-menu">
        <h2 id="nome-jogo"></h2>
      </div>

      <!-- CARTAZ RECETOR DO JOGO -->
      <div class="recetor-jogo">
        <div class="palavra-destaque" id="palavra-alvo">---</div>
        <p class="instrucao">Quantas sílabas tem esta palavra?</p>

        <div class="grelha-opcoes">
          <button class="botao-resposta" onclick="responder(1)">1 Sílaba</button>
          <button class="botao-resposta" onclick="responder(2)">2 Sílabas</button>
          <button class="botao-resposta" onclick="responder(3)">3 Sílabas</button>
          <button class="botao-resposta" onclick="responder(4)">4+ Sílabas</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <!-- BARRA DE PROGRESSO E RONDAS DENTRO DO MAIN -->
        <div class="barra-jogo-main">
          <div class="bloco-estrelas-pontos">
            <span class="icone-estrela" data-icone-estrela>★</span>
            <span id="pontos-contador">0</span>
          </div>

          <div class="estagio-rondas">
            <div class="barra-progresso-fundo">
              <div class="barra-progresso-preenchimento" id="barra-progresso"></div>
            </div>
            <span class="texto-ronda" id="texto-ronda">1/10</span>
          </div>

          <div class="botoes-auxiliares">
            <button class="btn-circulo" aria-label="Áudio" onclick="tocarSom()">🔊</button>
            <button class="btn-circulo" aria-label="Ajuda" onclick="mostrarAjuda()">?</button>
          </div>
        </div>
      </div>
    </main>

    <!-- RODAPÉ ORIGINAL -->
    <footer class="rodape">
      <div class="rodape-item">
        <span class="estrela" data-icone-estrela></span>
        <span data-mensagem></span>
      </div>
      <div class="rodape-item rodape-info">
        <span data-informacao></span>
        <div class="info" data-icone-info></div>
      </div>
    </footer>
  </div>

  <!-- TEMPLATE PARA O MENU DE ANOS -->
  <template id="modelo-menu-ano">
    <button class="menu-ano">
      <div class="menu-ano-icon"></div>
      <span class="menu-ano-nome"></span>
    </button>
  </template>

  <!-- DADOS E LÓGICA -->
  <script src="../dados.js"></script>
  <script src="dados_jogo.js"></script>
  <script>
    function inserirCSS() {
      const estilo = document.createElement("style");

      estilo.textContent = `
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100vh;
      font-family: "Nunito", "Quicksand", "Arial Rounded MT Bold", sans-serif;
    }

    html {
      background: linear-gradient(180deg, ${DADOS.cores.ceu1} 0%, ${DADOS.cores.ceu2} 19%, #F2F8FC 38%, ${DADOS.cores.fundo} 100%);
      background-attachment: fixed;
    }

    body { 
      background: transparent; 
      color: ${DADOS.cores.texto}; 
      overflow-x: hidden; 
    }

    button { font-family: inherit; }

    #app {
      min-height: 100vh;
      width: min(100%, ${DADOS.dimensoes.larguraMaxima}px);
      margin: 0 auto;
      padding: 0 0 16px;
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    .cabecalho {
      position: relative; width: 100%; height: 82px;
      background: linear-gradient(180deg, ${DADOS.cores.headerTopo} 0%, ${DADOS.cores.header} 100%);
      display: flex; align-items: center; justify-content: center;
      border-bottom: 2px solid rgba(255,255,255,.65);
      box-shadow: 0 3px 10px rgba(15,139,211,.12); z-index: 20;
    }

    .botao-menu, .botao-seta {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 58px; height: 58px; padding: 0; border: 0; border-radius: 50%;
      background: ${DADOS.cores.azulHeader}; cursor: pointer;
      box-shadow: 0 3px 7px rgba(0,0,0,.18);
      transition: transform .12s ease, box-shadow .12s ease; z-index: 25;
    }
    .botao-menu { left: 18px; }
    .botao-seta { right: 18px; }

    .botao-menu:active, .botao-seta:active {
      transform: translateY(calc(-50% + 3px)) scale(0.95);
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }

    .botao-menu::before {
      content: ""; position: absolute; width: 56%; height: 56%; left: 22%; top: 22%;
      background-image: url("${DADOS.icons.menu}"); background-size: contain; background-repeat: no-repeat;
    }
    .botao-seta::before {
      content: ""; position: absolute; width: 58%; height: 58%; left: 21%; top: 21%;
      background-image: url("${DADOS.icons.seta}"); background-size: contain; background-repeat: no-repeat;
    }

    .marca { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; max-width: 65%; padding: 0 50px; }
    .marca-sol { width: 64px; height: 64px; flex: 0 0 64px; background-image: url("${DADOS.icons.cabecalho}"); background-size: contain; background-repeat: no-repeat; background-position: center; }
    .marca-texto { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .marca-texto h1 { margin: 0; font-size: clamp(26px, 2.8vw, 42px); line-height: 1.1; font-weight: 900; color: ${DADOS.cores.textoEscuro}; text-shadow: 0 2px 0 rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .marca-texto p { margin: 3px 0 0; font-size: clamp(12px, 1.1vw, 16px); line-height: 1.1; font-weight: 800; color: ${DADOS.cores.texto}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .menu-acordeao {
      position: absolute; top: 72px; left: 18px; width: 300px; padding: 0;
      background: rgba(255,255,255,.98); border: 2px solid ${DADOS.cores.linha};
      border-top: 4px solid ${DADOS.cores.azulHeader}; border-radius: 0 0 20px 20px;
      box-shadow: 0 10px 25px rgba(15,139,211,.24);
      opacity: 0; visibility: hidden; transform: translateY(-12px) scale(.98);
      transform-origin: top left; transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
      z-index: 30;
    }
    .menu-acordeao.aberto { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .menu-acordeao-topo { padding: 15px 18px 13px; background: linear-gradient(180deg, #E6F4FA, #FFFFFF); border-bottom: 1px solid ${DADOS.cores.linha}; }
    .menu-acordeao-titulo { font-size: 19px; font-weight: 900; color: ${DADOS.cores.textoEscuro}; }
    .menu-acordeao-subtitulo { margin-top: 3px; font-size: 12px; font-weight: 700; color: #0F8BD3; }
    
    .menu-anos { display: flex; flex-direction: column; padding: 8px; gap: 5px; max-height: 60vh; overflow-y: auto; }
    .menu-ano {
      width: 100%; min-height: 54px; display: flex; align-items: center; gap: 13px; padding: 6px 11px;
      border: 0; border-radius: 13px; background: #FFFFFF; color: ${DADOS.cores.textoEscuro};
      font-size: 15px; font-weight: 800; text-align: left; cursor: pointer; transition: background .16s ease;
    }
    .menu-ano:hover { background: #E6F4FA; transform: translateX(3px); }
    .menu-ano-icon { width: 45px; height: 45px; flex: 0 0 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #F0F9FC; }
    .menu-ano-icon img { width: 100%; height: 100%; object-fit: contain; }
    .menu-ano-nome { flex: 1; }

    .area-menu { position: relative; width: 100%; margin-top: 20px; padding: 0 20px; }
    .titulo-menu {
      width: fit-content; margin: 1px auto 19px; padding: 8px 30px;
      border: 2px solid ${DADOS.cores.linha};
      border-radius: 16px;
      background: linear-gradient(180deg, #FFFFFF, ${DADOS.cores.creme});
      box-shadow: 0 3px 7px ${DADOS.cores.sombra};
    }
    .titulo-menu h2 { margin: 0; font-size: clamp(18px, 1.7vw, 27px); font-weight: 900; color: ${DADOS.cores.textoEscuro}; text-align: center; }

    /* CARTAZ RECETOR CENTRAL (Base PC usando os dados) */
    .recetor-jogo {
      width: min(100%, var(--pc-largura));
      margin: 0 auto;
      padding: var(--pc-padding);
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid ${DADOS.cores.linha};
      border-radius: 24px;
      box-shadow: 0 8px 20px ${DADOS.cores.sombra};
      text-align: center;
    }

    .palavra-destaque {
      font-size: var(--pc-fonte);
      font-weight: 900;
      color: ${DADOS.cores.azulHeader};
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .instrucao {
      font-size: clamp(16px, 1.5vw, 20px);
      font-weight: 800;
      color: ${DADOS.cores.textoEscuro};
      margin-bottom: 25px;
    }

    .grelha-opcoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .botao-resposta {
      padding: 16px 20px;
      font-size: clamp(16px, 1.4vw, 20px);
      font-weight: 900;
      color: #FFFFFF;
      background: linear-gradient(145deg, var(--cor-jogo-1) 0%, var(--cor-jogo-2) 100%);
      border: 2px solid #FFFFFF;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 5px 12px ${DADOS.cores.sombra};
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .botao-resposta:hover { transform: translateY(-3px); }
    .botao-resposta:active { transform: translateY(1px); }

    .feedback {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 900;
      min-height: 28px;
    }

    /* BARRA DE PROGRESSO DENTRO DO MAIN */
    .barra-jogo-main {
      margin-top: 25px;
      padding: 10px 18px;
      background: ${DADOS.cores.azulHeader};
      border: 2px solid ${DADOS.cores.linha};
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 12px ${DADOS.cores.sombra};
    }

    .bloco-estrelas-pontos {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 60, 110, 0.25);
      padding: 5px 12px;
      border-radius: 25px;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 900;
    }

    .icone-estrela { color: #FFB400; font-size: 22px; }

    .estagio-rondas {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .barra-progresso-fundo {
      flex: 1;
      height: 18px;
      background: rgba(0, 60, 110, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      overflow: hidden;
    }

    .barra-progresso-preenchimento {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #51E12A, #82FF59);
      border-radius: 12px;
      transition: width 0.3s ease;
    }

    .texto-ronda {
      color: #FFFFFF;
      font-weight: 900;
      font-size: 16px;
      min-width: 40px;
    }

    .botoes-auxiliares {
      display: flex;
      gap: 8px;
    }

    .btn-circulo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 60, 110, 0.3);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .btn-circulo:hover { background: rgba(0, 60, 110, 0.5); }

    .rodape {
      width: calc(100% - 40px); min-height: 53px; margin: 15px 20px 0; padding: 8px 17px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center;
      border: 2px solid ${DADOS.cores.linha}; border-radius: 14px; background: rgba(255,255,255,.78);
      font-size: clamp(11px, 1vw, 14px); font-weight: 800;
    }
    .rodape-item { display: flex; align-items: center; gap: 8px; }
    .rodape-info { justify-content: flex-end; }
    .estrela { color: #FFB400; font-size: 25px; }
    .info { 
      width: 25px; height: 25px; min-width: 25px; min-height: 25px;
      display: inline-flex; align-items: center; justify-content: center; 
      border-radius: 50% !important; color: #fff; background: ${DADOS.cores.azulHeader}; 
      font-size: 12px; font-weight: 900; overflow: hidden; flex-shrink: 0;
    }

    /* =========================================================
       MEDIA QUERIES APLICANDO OS VALORES VINDOS DE DADOS_JOGO
       ========================================================= */

    /* 1. TABLET VERTICAL */
    @media (min-width: 577px) and (max-width: 1024px) and (orientation: portrait) {
      .recetor-jogo { width: var(--tablet-v-largura); padding: var(--tablet-v-padding); }
      .palavra-destaque { font-size: var(--tablet-v-fonte); }
    }

    /* 2. TABLET HORIZONTAL */
    @media (min-width: 768px) and (max-width: 1200px) and (orientation: landscape) {
      .recetor-jogo { width: min(100%, var(--tablet-h-largura)); padding: var(--tablet-h-padding); }
      .palavra-destaque { font-size: var(--tablet-h-fonte); }
    }

    /* 3. TELEMÓVEL VERTICAL */
    @media (max-width: 576px) and (orientation: portrait) {
      .cabecalho { height: 70px; }
      .botao-menu, .botao-seta { width: 48px; height: 48px; }
      .botao-menu { left: 12px; }
      .botao-seta { right: 12px; }
      .marca { padding: 0 44px; gap: 8px; max-width: 72%; }
      .marca-sol { width: 42px; height: 42px; flex: 0 0 42px; }
      .marca-texto h1 { font-size: 20px; }
      .marca-texto p { font-size: 10px; }
      .menu-acordeao { top: 62px; left: 12px; width: calc(100vw - 24px); max-width: 280px; }

      .recetor-jogo { width: 100%; padding: var(--mov-v-padding); border-radius: 16px; }
      .palavra-destaque { font-size: var(--mov-v-fonte); }
      .grelha-opcoes { grid-template-columns: 1fr; gap: 10px; }
      .botao-resposta { padding: 12px; font-size: 16px; }
      .barra-jogo-main { padding: 6px 10px; gap: 8px; border-radius: 25px; }
      .bloco-estrelas-pontos { font-size: 14px; padding: 4px 8px; }
      .texto-ronda { font-size: 14px; }
      .btn-circulo { width: 34px; height: 34px; font-size: 14px; }
      .rodape { width: calc(100% - 32px); margin: 10px 16px 0; padding: 8px 12px; font-size: 11px; }
    }

    /* 4. TELEMÓVEL HORIZONTAL */
    @media (max-height: 550px) and (max-width: 900px) {
      .cabecalho { height: 62px; }
      .botao-menu, .botao-seta { width: 42px; height: 42px; }
      .botao-menu { left: 10px; }
      .botao-seta { right: 10px; }
      .marca { padding: 0 38px; gap: 6px; max-width: 70%; }
      .marca-sol { width: 36px; height: 36px; flex: 0 0 36px; }
      .marca-texto h1 { font-size: 16px; }
      .marca-texto p { font-size: 9px; }
      .menu-acordeao { width: 260px; top: 54px; left: 10px; }

      .area-menu { margin-top: 10px; }
      .titulo-menu { margin-bottom: 8px; padding: 4px 16px; }
      .titulo-menu h2 { font-size: 16px; }

      .recetor-jogo { width: 100%; max-width: var(--mov-h-largura); padding: var(--mov-h-padding); }
      .palavra-destaque { font-size: var(--mov-h-fonte); margin-bottom: 4px; }
      .instrucao { font-size: 13px; margin-bottom: 10px; }
      .grelha-opcoes { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .botao-resposta { padding: 8px; font-size: 13px; border-radius: 10px; }
      .feedback { margin-top: 6px; font-size: 14px; min-height: 20px; }

      .barra-jogo-main { margin-top: 10px; padding: 4px 10px; }
      .btn-circulo { width: 30px; height: 30px; font-size: 12px; }
      .rodape { display: none; }
    }
      `;

      // Injeta as cores e dimensões a partir de DADOS_JOGO nas variáveis CSS
      document.documentElement.style.setProperty('--cor-jogo-1', DADOS_JOGO.coresJogo.corPrimaria);
      document.documentElement.style.setProperty('--cor-jogo-2', DADOS_JOGO.coresJogo.corSecundaria);
      
      const dim = DADOS_JOGO.dimensoes;
      document.documentElement.style.setProperty('--pc-largura', dim.pc.larguraRecetor + 'px');
      document.documentElement.style.setProperty('--pc-padding', dim.pc.paddingRecetor + 'px');
      document.documentElement.style.setProperty('--pc-fonte', dim.pc.tamanhoPalavra + 'px');

      document.documentElement.style.setProperty('--tablet-v-largura', dim.tabletVertical.larguraRecetor + '%');
      document.documentElement.style.setProperty('--tablet-v-padding', dim.tabletVertical.paddingRecetor + 'px');
      document.documentElement.style.setProperty('--tablet-v-fonte', dim.tabletVertical.tamanhoPalavra + 'px');

      document.documentElement.style.setProperty('--tablet-h-largura', dim.tabletHorizontal.larguraRecetor + 'px');
      document.documentElement.style.setProperty('--tablet-h-padding', dim.tabletHorizontal.paddingRecetor + 'px');
      document.documentElement.style.setProperty('--tablet-h-fonte', dim.tabletHorizontal.tamanhoPalavra + 'px');

      document.documentElement.style.setProperty('--mov-v-padding', dim.telemovelVertical.paddingRecetor + 'px');
      document.documentElement.style.setProperty('--mov-v-fonte', dim.telemovelVertical.tamanhoPalavra + 'px');

      document.documentElement.style.setProperty('--mov-h-largura', dim.telemovelHorizontal.larguraRecetor + 'px');
      document.documentElement.style.setProperty('--mov-h-padding', dim.telemovelHorizontal.paddingRecetor + 'px');
      document.documentElement.style.setProperty('--mov-h-fonte', dim.telemovelHorizontal.tamanhoPalavra + 'px');

      document.head.appendChild(estilo);
    }

    function preencherTextosGlobais() {
      if (DADOS.pagina.browserTitulo) document.title = DADOS_JOGO.informacoes.tituloJogo + " - " + DADOS.pagina.browserTitulo;
      
      const marca = document.querySelector("[data-marca]");
      const submarca = document.querySelector("[data-submarca]");
      const mensagem = document.querySelector("[data-mensagem]");
      const informacoes = document.querySelectorAll("[data-informacao]");
      const tituloMenuAcordeao = document.querySelector("[data-titulo-menu-acordeao]");
      const iconeEstrela = document.querySelectorAll("[data-icone-estrela]");
      const iconeInfo = document.querySelector("[data-icone-info]");

      if (marca) marca.textContent = DADOS.pagina.titulo;
      if (submarca) submarca.textContent = DADOS_JOGO.informacoes.subtitulo + " • " + DADOS_JOGO.informacoes.destinado;
      if (mensagem) mensagem.textContent = DADOS.pagina.mensagem;
      if (tituloMenuAcordeao) tituloMenuAcordeao.textContent = DADOS.pagina.tituloMenuAcordeao;
      if (iconeInfo) iconeInfo.textContent = DADOS.pagina.iconeInfo;
      iconeEstrela.forEach(el => el.textContent = DADOS.pagina.iconeEstrela);
      informacoes.forEach(el => el.textContent = DADOS.pagina.informacao);
    }

    function criarMenuAnos() {
      const recipiente = document.getElementById("menu-anos");
      const modelo = document.getElementById("modelo-menu-ano");
      if (!recipiente || !modelo) return;

      recipiente.innerHTML = "";
      DADOS.menuAnos.forEach(ano => {
        const item = modelo.content.cloneNode(true);
        const botao = item.querySelector(".menu-ano");
        const icone = item.querySelector(".menu-ano-icon");
        const nome = item.querySelector(".menu-ano-nome");

        const imagem = document.createElement("img");
        imagem.src = DADOS.icons.menuAnos[ano.icon];
        imagem.alt = "";
        icone.appendChild(imagem);

        nome.textContent = ano.nome;
        botao.addEventListener("click", () => { window.location.href = ano.pagina; });
        recipiente.appendChild(item);
      });
    }

    function configurarMenu() {
      const botaoMenu = document.querySelector(".botao-menu");
      const menu = document.querySelector(".menu-acordeao");
      const botaoSeta = document.querySelector(".botao-seta");

      if (botaoMenu && menu) {
        botaoMenu.addEventListener("click", event => {
          event.stopPropagation();
          menu.classList.toggle("aberto");
        });
        document.addEventListener("click", event => {
          if (menu.classList.contains("aberto") && !menu.contains(event.target) && !botaoMenu.contains(event.target)) {
            menu.classList.remove("aberto");
          }
        });
      }

      if (botaoSeta) {
        botaoSeta.addEventListener("click", () => { window.location.href = "../index.html"; });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      inserirCSS();
      preencherTextosGlobais();
      criarMenuAnos();
      configurarMenu();
      if (typeof inicializarJogo === "function") inicializarJogo();
    });
  </script>
</body>
</html>
