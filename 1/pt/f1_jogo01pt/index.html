<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 - Jogo 01: Divisão Silábica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <button class="botao-menu" aria-label="Menu Principal" aria-expanded="false" aria-controls="menu-acordeao"></button>
    
    <div class="marca">
      <div class="marca-sol" aria-hidden="true"></div>
      <div class="marca-texto">
        <h1>Português</h1>
        <p>Fase 1 - Divisão Silábica</p>
      </div>
    </div>

    <button class="botao-seta" aria-label="Voltar" onclick="window.location.href='../index.html'"></button>
  </header>

  <div id="app">
    <!-- ÁREA PRINCIPAL DO JOGO -->
    <main class="area-menu">
      <div class="titulo-menu">
        <h2>Quantas sílabas tem a palavra?</h2>
      </div>

      <div class="jogo-container">
        <div class="palavra-alvo" id="palavra-alvo">A carregar...</div>
        <p class="instrucao-jogo">Clica no número correto de sílabas:</p>
        
        <div class="opcoes-silabas">
          <button class="botao-opcao" onclick="verificarResposta(1)">1 Sílaba (Monossílabo)</button>
          <button class="botao-opcao" onclick="verificarResposta(2)">2 Sílabas (Dissílabo)</button>
          <button class="botao-opcao" onclick="verificarResposta(3)">3 Sílabas (Trissílabo)</button>
          <button class="botao-opcao" onclick="verificarResposta(4)">4+ Sílabas (Polissílabo)</button>
        </div>

        <div class="mensagem-feedback" id="feedback"></div>
      </div>
    </main>

    <!-- RODAPÉ CONSISTENTE -->
    <footer class="rodape">
      <div class="rodape-item">
        <span class="estrela">⭐</span>
        <span id="pontuacao">Pontos: 0</span>
      </div>
      <div class="rodape-item rodape-info">
        <span>Recursos Educativos</span>
        <div class="info">i</div>
      </div>
    </footer>
  </div>

  <!-- ESTILOS CSS -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100vh;
      font-family: "Nunito", "Quicksand", "Arial Rounded MT Bold", sans-serif;
    }

    html {
      background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 19%, #F2F8FC 38%, #E8F4F8 100%);
      background-attachment: fixed;
    }

    body { 
      background: transparent; 
      color: #2C3E50; 
      overflow-x: hidden; 
    }

    button { font-family: inherit; }

    #app {
      min-height: 100vh;
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 0 0 16px;
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    .cabecalho {
      position: relative; width: 100%; height: 82px;
      background: linear-gradient(180deg, #1A6BB5 0%, #0F5C9E 100%);
      display: flex; align-items: center; justify-content: center;
      border-bottom: 2px solid rgba(255,255,255,.65);
      box-shadow: 0 3px 10px rgba(15,139,211,.12); z-index: 20;
    }

    .botao-menu, .botao-seta {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 58px; height: 58px; padding: 0; border: 0; border-radius: 50%;
      background: #2575FC; cursor: pointer;
      box-shadow: 0 3px 7px rgba(0,0,0,.18);
      transition: transform .12s ease, box-shadow .12s ease; z-index: 25;
    }
    .botao-menu { left: 18px; }
    .botao-seta { right: 18px; }

    .botao-menu::before {
      content: "≡"; color: white; font-size: 32px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%);
    }
    .botao-seta::before {
      content: "←"; color: white; font-size: 28px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%);
    }

    .marca { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; max-width: 65%; padding: 0 50px; }
    .marca-sol { width: 45px; height: 45px; flex: 0 0 45px; background: #FFD700; border-radius: 50%; box-shadow: 0 0 10px #FFD700; }
    .marca-texto { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .marca-texto h1 { margin: 0; font-size: clamp(22px, 2.5vw, 36px); line-height: 1.1; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .marca-texto p { margin: 3px 0 0; font-size: clamp(12px, 1vw, 15px); line-height: 1.1; font-weight: 800; color: #E0F7FA; }

    .area-menu { position: relative; width: 100%; margin-top: 20px; padding: 0 20px; }
    
    /* TÍTULO COM A MESMA COR DA LINHA DO RODAPÉ (#0F8BD3) */
    .titulo-menu {
      width: fit-content; margin: 1px auto 19px; padding: 8px 30px;
      border: 2px solid #0F8BD3;
      border-radius: 16px;
      background: linear-gradient(180deg, #FFFFFF, #FFF9E6);
      box-shadow: 0 3px 7px rgba(15,139,211,.15);
    }
    .titulo-menu h2 { margin: 0; font-size: clamp(18px, 1.7vw, 27px); font-weight: 900; color: #1A365D; text-align: center; }

    /* ESTILO DO JOGO */
    .jogo-container {
      max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.95);
      padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(15,139,211,0.15);
      text-align: center; border: 2px solid #0F8BD3;
    }

    .palavra-alvo {
      font-size: clamp(32px, 4vw, 48px); font-weight: 900; color: #0F5C9E;
      margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;
    }

    .instrucao-jogo {
      font-size: 18px; font-weight: 800; color: #4A5568; margin-bottom: 25px;
    }

    .opcoes-silabas {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;
    }

    .botao-opcao {
      padding: 18px; font-size: 16px; font-weight: 800; color: white;
      background: linear-gradient(135deg, #2575FC 0%, #6A11CB 100%);
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.1s ease, filter 0.1s ease;
    }

    .botao-opcao:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .botao-opcao:active { transform: translateY(1px); }

    .mensagem-feedback {
      font-size: 20px; font-weight: 900; min-height: 30px; margin-top: 15px;
    }

    /* RODAPÉ */
    .rodape {
      width: calc(100% - 40px); min-height: 53px; margin: 25px 20px 0; padding: 8px 17px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center;
      border: 2px solid #0F8BD3; border-radius: 14px; background: rgba(255,255,255,.9);
      font-size: clamp(11px, 1vw, 14px); font-weight: 800;
    }
    .rodape-item { display: flex; align-items: center; gap: 8px; }
    .rodape-info { justify-content: flex-end; }
    .estrela { color: #FFB400; font-size: 25px; }
    .info { 
      width: 25px; height: 25px; min-width: 25px; min-height: 25px;
      display: inline-flex; align-items: center; justify-content: center; 
      border-radius: 50% !important; color: #fff; background: #0F5C9E; 
      font-size: 12px; font-weight: 900;
    }
  </style>

  <!-- LÓGICA DO JOGO -->
  <script src="jogo.js"></script>
</body>
</html>
