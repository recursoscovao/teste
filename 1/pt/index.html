<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1.º Ano - Recursos Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CABEÇALHO A OCUPAR A LARGURA TOTAL DO ECRÃ -->
  <header class="cabecalho">
    <button class="botao-menu" aria-label="Menu Principal" aria-expanded="false" aria-controls="menu-acordeao"></button>
    
    <div class="marca">
      <div class="marca-sol" aria-hidden="true"></div>
      <div class="marca-texto">
        <h1 data-marca></h1>
        <p data-submarca></p>
      </div>
    </div>

    <button class="botao-seta" aria-label="Voltar"></button>

    <!-- MENU ACORDEÃO -->
    <nav id="menu-acordeao" class="menu-acordeao" aria-hidden="true">
      <div class="menu-acordeao-topo">
        <div class="menu-acordeao-titulo">Menu</div>
        <div class="menu-acordeao-subtitulo" data-informacao></div>
      </div>
      <div id="menu-anos" class="menu-anos"></div>
    </nav>
  </header>

  <div id="app">
    <!-- ÁREA PRINCIPAL / FASES COM CARTÕES -->
    <main class="area-menu">
      <div class="titulo-menu">
        <h2 data-titulo-menu></h2>
      </div>

      <!-- Onde serão injetadas dinamicamente as 4 fases -->
      <div id="fases-container"></div>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
      <div class="rodape-item">
        <span class="estrela">★</span>
        <span data-mensagem></span>
      </div>
      <div class="rodape-item rodape-info">
        <span data-informacao></span>
        <div class="info">i</div>
      </div>
    </footer>
  </div>

  <!-- TEMPLATES -->
  <template id="modelo-fase">
    <section class="secao-fase">
      <h3 class="titulo-fase"></h3>
      <div class="anos"></div>
    </section>
  </template>

  <template id="modelo-ano">
    <div class="ano">
      <button class="botao-ano">
        <div class="icone-ano"></div>
        <div class="texto-ano">
          <div class="nome-ano"></div>
          <div class="idade-ano"></div>
        </div>
      </button>
    </div>
  </template>

  <template id="modelo-menu-ano">
    <button class="menu-ano">
      <div class="menu-ano-icon"></div>
      <span class="menu-ano-nome"></span>
    </button>
  </template>

  <!-- SCRIPTS -->
  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
