<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos Covão</title>
</head>

<body>

  <main id="app">

    <!-- NUVENS -->
    <div class="camada-nuvens" aria-hidden="true"></div>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
      <div class="marca">

        <div class="marca-sol" aria-hidden="true"></div>

        <div class="marca-texto">
          <h1 data-marca></h1>
          <p data-submarca></p>
        </div>

      </div>
    </header>


    <!-- ÁREAS -->
    <section class="area-menu" aria-labelledby="titulo-menu">

      <div class="decoracao decoracao-esquerda" aria-hidden="true"></div>
      <div class="decoracao decoracao-direita" aria-hidden="true"></div>

      <div class="titulo-menu">
        <h2 id="titulo-menu" data-titulo-menu></h2>
      </div>


      <div class="areas" id="areas">

        <template id="modelo-area">

          <article class="area">

            <button class="botao-area" type="button">

              <div class="icone-area">
                <img alt="" draggable="false">
              </div>

              <div class="texto-area">
                <div class="nome-area"></div>
                <div class="descricao-area"></div>
              </div>

            </button>

          </article>

        </template>

      </div>

    </section>


    <!-- JOGOS EM DESTAQUE -->
    <section class="destaques" aria-labelledby="titulo-destaques">

      <div class="titulo-destaques">

        <span class="linha"></span>

        <h2 id="titulo-destaques">
          <span aria-hidden="true">🎮</span>
          Jogos em destaque
        </h2>

        <span class="linha"></span>

      </div>


      <div class="jogos" id="jogos">

        <template id="modelo-jogo">

          <article class="jogo">

            <div class="icone-jogo">
              <img alt="" draggable="false">
            </div>

            <div class="nome-jogo"></div>

            <div class="estrelas" aria-label="5 estrelas">
              ★★★★★
            </div>

          </article>

        </template>

      </div>

    </section>


    <!-- RODAPÉ -->
    <footer class="rodape">

      <div class="rodape-item">

        <span class="estrela" aria-hidden="true">★</span>

        <span data-mensagem></span>

      </div>


      <div class="rodape-item rodape-info">

        <span class="info" aria-hidden="true">i</span>

        <span data-informacao></span>

      </div>

    </footer>

  </main>


  <script src="dados.js"></script>

</body>
</html>
