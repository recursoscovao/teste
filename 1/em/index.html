<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pequenos Exploradores</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>:root{--c:#994D4D;--bg:#EAE2E5}body{margin:0;background:#eef6fc;font-family:'Nunito',system-ui,sans-serif;color:#38546c}header{background:#fff;border-radius:0 0 32px 32px;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 15px #0001}header img{height:55px}.brand b{display:block;font-size:1.35rem}.brand span{color:#8792a1;font-weight:700;font-size:.72rem}.wrap{max-width:1200px;margin:auto;padding:24px 16px}.intro{text-align:center;font-weight:800;font-size:1.2rem;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.card{background:#fff;border:3px solid var(--c);border-radius:28px;padding:15px;text-decoration:none;color:#38546c;box-shadow:0 8px 20px #0000000b}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:22px}.card b{display:block;color:var(--c);font-size:.9rem;text-align:center;margin-top:10px}.card small{display:block;text-align:center;color:#8792a1;font-weight:700;margin-top:4px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){header img{height:44px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{border-radius:22px;padding:10px}.card b{font-size:.78rem}}</style></head><body><header><a href="../../index.html"><img src="../../icons/icon1.png" alt="1º Ano"></a><div class="brand"><b>Pequenos Exploradores</b><span>1º ANO | EM</span></div></header><div class="wrap"><div class="intro">Animais, frutos e natureza</div><div class="grid" id="grid"></div></div><script src="dados.js"></script><script>JOGO_CONFIG.listaJogos.forEach(j=>{const a=document.createElement('a');a.className='card';a.href=j.link;a.style.setProperty('--c','#994D4D');a.innerHTML='<img src="../../icons/'+j.icon+'" alt=""><b>'+j.nome+'</b><small>'+j.desc+'</small>';document.getElementById('grid').appendChild(a)})</script></body></html>
